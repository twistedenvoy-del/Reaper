<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Reaper</title>
  <link rel="stylesheet" href="game.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel&display=swap" rel="stylesheet">
</head>
<body>
  <div id="jumpscare"style="display:none">
    <div id="shadow-figure">
      <div id ="shadow-head"></div>
      <div id ="shadow-body"></div>
    </div>
  </div>
  <div id = "text-scare" style = "display:none">RUN</div>
  <div class="game-container">
    <div class="status-bar">
      <span id="health-display">Health: 100</span>
      <span id="sanity-display">Sanity: 100</span>
      <span id="fear-display">Fear: 0</span>
    </div>
    <div class="game-text" id="game-text">
      <p>You stand amongst the darkness, an eerie building looming before you. What do you do?</p>
    </div>
    <div class="action-buttons">
      <button type="button" onclick="handleInvestigate()" id="investigate">Investigate</button>
      <button type="button" onclick="handleStatus()" id="status">Check Status</button>
      <button type="button" onclick="handleLeave()" id= "leave">Leave</button>
       <button type = "button" id = "extra"  style="display:none" onclick = "handleExtra()">...</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
    </html>
